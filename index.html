<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dobrodošli - Marta</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .glavni-naslov {
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .napomena {
            font-size: 0.85rem;
            color: #777;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glavni-naslov">
            Bok, ja sam Marta.<br>
            Sve vas pozivam da zajedno učimo strane jezike!
        </div>
        
        <div class="napomena">
            Stranica mi je još u izradi.
        </div>
    </div>

</body>
</html>
