<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Učenje jezika s Martom</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        #poruka {
            margin-top: 15px;
            font-weight: bold;
            color: #2e7d32;
        }

        .napomena {
            font-size: 0.8rem;
            color: #777;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bok, ja sam Marta.<br>Sve vas pozivam da zajedno učimo strane jezike!</h1>
        
        <!-- Forma s interaktivnim elementima -->
        <div class="form-group">
            <label for="ime">Tvoje ime:</label>
            <input type="text" id="ime" placeholder="Unesi svoje ime...">
        </div>

        <div class="form-group">
            <label for="jezik">Izaberi jezik koji želiš učiti:</label>
            <select id="jezik">
                <option value="Engleski">Engleski</option>
                <option value="Njemački">Njemački</option>
                <option value="Španjolski">Španjolski</option>
                <option value="Talijanski">Talijanski</option>
            </select>
        </div>

        <button onclick="pozdraviKorisnika()">Prijavi se</button>

        <div id="poruka"></div>
        
        <div class="napomena">
            Stranica mi je još u izradi.
        </div>
    </div>

    <script>
        function pozdraviKorisnika() {
            const ime = document.getElementById('ime').value;
            const jezik = document.getElementById('jezik').value;
            const porukaDiv = document.getElementById('poruka');

            if (ime.trim() === "") {
                porukaDiv.style.color = "#d32f2f";
                porukaDiv.innerText = "Molimo upiši svoje ime prije prijave!";
            } else {
                porukaDiv.style.color = "#2e7d32";
                porukaDiv.innerText = "Super, " + ime + "! Radujemo se zajedničkom učenju jezika: " + jezik + ".";
            }
        }
    </script>

</body>
</html>
